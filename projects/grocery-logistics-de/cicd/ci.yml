# FreshCart data platform — CI/CD pipeline (GitHub Actions).
#
# NOTE: GitHub only runs workflows from `.github/workflows/` at the REPOSITORY ROOT.
# This file lives under the project so it doesn't hijack the monorepo. To activate it
# when this project is its own repo, copy it to `.github/workflows/ci.yml`.
#
# What it does on every push / PR:
#   1. lint    - style/static checks
#   2. test    - build the warehouse, run unit + data tests
#   3. build   - build & (on main) push the Docker image
#   4. deploy  - terraform plan (apply gated to main + manual approval)

name: freshcart-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/grocery-logistics-de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate data + build warehouse (E2E smoke)
        run: |
          python src/generate_data.py
          python src/contracts.py
          python src/run_pipeline.py        # exits 1 if any BLOCKING DQ check fails
      - name: Streaming smoke
        run: |
          python src/stream_simulator.py
          python src/stream_processor.py
      - name: Data + unit tests
        run: python -m unittest discover -s tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t freshcart-pipeline projects/grocery-logistics-de
      # On main, push to ECR (requires configured cloud creds / OIDC):
      # - run: docker push $ECR_REGISTRY/freshcart-pipeline:${{ github.sha }}

  plan:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/grocery-logistics-de/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
      # - run: terraform plan   # with cloud creds; apply gated to main + approval
